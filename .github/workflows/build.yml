name: build

on:
  push:
    branches: [ main, amazon-documentdb ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore OnlineMongoMigration.sln

      - name: Build
        run: dotnet build OnlineMongoMigration.sln -c Release --no-restore

      - name: Test
        run: dotnet test OnlineMongoMigrationProcessor.Tests/OnlineMongoMigrationProcessor.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Build Docker image
        run: docker build -f MongoMigrationWebApp/Dockerfile -t mongo-migration-webapp:ci .
